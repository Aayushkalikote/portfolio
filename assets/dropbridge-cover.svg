<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Inter, system-ui, sans-serif">
  <style>
    .dot { animation: go 2.6s linear infinite; }
    .dot.b { animation-direction: reverse; animation-delay: -1.3s; }
    @keyframes go { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    .dot { offset-path: path("M370 210 C 520 90, 680 90, 830 210"); }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; offset-distance: 50%; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <radialGradient id="l" cx=".2" cy=".5" r=".5"><stop offset="0" stop-color="#2563eb" stop-opacity=".35"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <radialGradient id="r" cx=".8" cy=".5" r=".5"><stop offset="0" stop-color="#16a34a" stop-opacity=".35"/><stop offset="1" stop-color="#16a34a" stop-opacity="0"/></radialGradient>
    <linearGradient id="arc" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#l)"/>
  <rect width="1200" height="420" fill="url(#r)"/>

  <!-- Mac -->
  <g transform="translate(150 130)">
    <rect x="0" y="0" width="210" height="135" rx="10" fill="#1f2937" stroke="#60a5fa" stroke-width="3"/>
    <rect x="12" y="12" width="186" height="111" rx="4" fill="#0f172a"/>
    <path d="M-20 145h250l-14 14H-6z" fill="#374151"/>
    <circle cx="105" cy="62" r="22" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <circle cx="105" cy="62" r="11" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".6"/>
    <text x="105" y="108" text-anchor="middle" font-size="15" fill="#93c5fd">AirDrop</text>
  </g>

  <!-- Android phone -->
  <g transform="translate(860 105)">
    <rect x="0" y="0" width="110" height="210" rx="18" fill="#1f2937" stroke="#4ade80" stroke-width="3"/>
    <rect x="10" y="22" width="90" height="166" rx="6" fill="#0f172a"/>
    <circle cx="55" cy="11" r="3" fill="#4ade80"/>
    <path d="M38 98l17-17 17 17M55 81v40" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="150" text-anchor="middle" font-size="14" fill="#86efac">Quick Share</text>
  </g>

  <!-- bridge -->
  <path d="M370 210 C 520 90, 680 90, 830 210" fill="none" stroke="url(#arc)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle class="dot" r="7" fill="#93c5fd"/>
  <circle class="dot b" r="7" fill="#86efac"/>

  <text x="600" y="300" text-anchor="middle" font-size="44" font-weight="600" fill="#f9fafb" letter-spacing="-1">DropBridge</text>
  <text x="600" y="336" text-anchor="middle" font-size="18" fill="#9ca3af">Files between Mac and Android, over your Wi-Fi. No phone app.</text>
  <text x="600" y="380" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" fill="#6b7280">$ brew install aayushkalikote/tap/dropbridge</text>
</svg>
