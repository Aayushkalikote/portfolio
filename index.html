<script>
  // Theme follows the visitor's clock: light from 5am, dark from 5pm. ?time=night or ?time=day previews it.
  (function () {
    var t = new URLSearchParams(location.search).get("time");
    var h = new Date().getHours();
    var dark = t ? t === "night" : (h < 5 || h >= 17);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">

    <section class="hero">
      <img class="avatar xl" src="assets/profile.jpg" alt="" onerror="this.onerror=null;this.src='assets/profile.svg'">
      <h1>Hey, I'm Aayush.</h1>
      <p>Software Engineer in Kathmandu. Ask anything about my work, or type <code>/</code> for commands.</p>
      <div class="chips" id="suggest"></div>
    </section>

    <section class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></section>

    <form class="composer" id="composer" autocomplete="off">
      <div class="slash" id="slash" role="listbox" hidden></div>
      <label class="sr" for="q">Message</label>
      <textarea id="q" rows="1" placeholder="Ask anything, or type / for commands"></textarea>
      <button class="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
